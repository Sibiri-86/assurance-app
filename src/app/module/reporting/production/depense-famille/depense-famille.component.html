        <p-dialog [maximizable]="true" [(visible)]="display" header="Dépense  d'une famille" [modal]="true" styleClass="p-fluid" 
        [style]="{width: '1000px'}">

        <ng-template pTemplate="content">
            <div class="card">


                <form>
                    <div class="p-fluid p-formgrid p-grid">
                        <div class="p-field p-col-4">
                            <label class="espace1" for="journal">Date debut <span style="color: red !important; size: 1.4em;" class="required"></span></label>
                       
                            
                            <input  type="date" pInputText [(ngModel)]="dateDebut" name="dateDebut">
                        </div>
                        <div class="p-field p-col-4">
                            <label class="espace1" for="journal">Date fin<span style="color: red !important; size: 1.4em;" class="required"></span> </label>
                       
                            
                            <input  type="date" pInputText [(ngModel)]="dateFin" name="dateFin">
                        </div>
                            
                        </div>

                        
                        <div class="p-fluid p-formgrid p-grid">

                                <div class="p-field p-col-4">
                                <label class="espace1" for="numCompte">Garant <span style="color: red !important; size: 1.4em;" class="required"></span></label>
                                <p-dropdown [filter]="true" 
                                showClear="true" [options]="garantList"
                                name="garant"
                                optionLabel="nom" 
                                [autoDisplayFirst]="false" [(ngModel)]="garantId" (onChange)="loadPoliceByGarant()" >
                                </p-dropdown>
        
                            </div>
                            
                            <div class="p-field p-col-4">
                                <label class="espace1" for="numCompte2"> Police <span style="color: red !important; size: 1.4em;" class="required"></span></label>
                                <p-dropdown [filter]="true" 
                                showClear="true" [options]="policeList"
                                name="police"
                                optionLabel="nom" 
                                [autoDisplayFirst]="false" [(ngModel)]="policeId" (onChange)="loadGroupeByPolice()">
                                </p-dropdown>
                            </div>

                                </p-dropdown>
                            </div>
